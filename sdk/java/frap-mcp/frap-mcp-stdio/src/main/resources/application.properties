# stdout is reserved for the MCP stdio JSON-RPC protocol.
# Anything written to stdout (banner, console logs) corrupts the handshake.
spring.main.web-application-type=none
spring.main.banner-mode=off

# MCP server identity / transport
spring.ai.mcp.server.name=frap-mcp-stdio
spring.ai.mcp.server.version=1.1.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true

# I/O mode: stdio = file-mode. Server and agent share the local filesystem, so
# large artefacts (DOM snapshot, ElementMap, generated Page Object) are passed
# by absolute path + a compact digest instead of inline JSON — keeps them out of
# the agent context. Activates FrapFileTools via @ConditionalOnProperty.
frap.io.mode=file

# Runtime base directory (native binary extract, work dir, logs). Default:
# <directory-of-running-jar>/.frap — not /tmp (many hosts block exec from tmp).
#frap.runtime.dir=

# Working directory for file-mode artefacts. Default: ${frap.runtime.dir}/work
#frap.io.work-dir=

# Logging: file only under ${frap.runtime.dir}/logs/frap-mcp.log (set by FrapRuntimeEnvironmentPostProcessor).
# stdout is reserved for the MCP protocol stream.
logging.threshold.console=OFF
